<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Hotel Almendro</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <div class="brand-copy">
        <div class="subtitle">Área Obras · Mantención y Mejoras</div>
        <h1>Hotel <em>El Almendro</em></h1>
        <div class="date">Sistema de gestión</div>
      </div>
    </div>
  </header>

  <div class="auth-layout">
    <aside class="auth-left">
      <div class="logo-area">
        <div class="image-placeholder">Imagen aquí</div>
      </div>
      <div class="card login-card">
        <h1>Hotel Almendro</h1>
        <form id="loginForm" onsubmit="return false;">
          <label>Usuario</label>
          <input id="username" type="text" placeholder="Ingresa tu nombre" required>
          <label>Contraseña</label>
          <input type="password" placeholder="Contraseña" required>
          <label for="userRoleSelect">Rol</label>
          <select id="userRoleSelect" required>
            <option value="">Selecciona tu rol</option>
            <option value="Admin">Admin</option>
            <option value="Bodeguero">Bodeguero</option>
            <option value="Recepción">Recepción</option>
            <option value="Cocina">Cocina</option>
          </select>
          <button id="loginBtn" class="btn">Entrar</button>
        </form>
        <p class="muted">Selecciona el rol de la persona que ingresará al sistema.</p>
      </div>
    </aside>
    <aside class="auth-right">
      <!-- área derecha opcional para imagen/branding -->
    </aside>
  </div>
  <script src="../../js/main.js"></script>
</body>
</html>
